name: Build and Release Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate temporary debug keystore
        run: |
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        run: |
          RELEASE_TAG="v${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="SkyCut-${RELEASE_TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${ASSET_NAME}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "ASSET_NAME=${ASSET_NAME}" >> $GITHUB_ENV

      - name: Publish GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" "${ASSET_NAME}" \
            --target "${{ github.sha }}" \
            --title "SkyCut ${RELEASE_TAG}" \
            --notes "Automated Debug APK build from run ${{ github.run_number }} (attempt ${{ github.run_attempt }})." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            gh release view "${RELEASE_TAG}"
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: SkyCut ${RELEASE_TAG}"
            RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Direct GitHub Release URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${ASSET_NAME}"

            echo "### 🚀 APK Download Available" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The Debug APK has been published to GitHub Releases:" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`${RELEASE_TAG}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Release URL:** [${RELEASE_URL}](${RELEASE_URL})" >> $GITHUB_STEP_SUMMARY
            echo "- **Asset Filename:** \`${ASSET_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK file directly from the **Assets** section of the release page above." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> **Note:** The standard Actions artifact \`app-debug-apk\` is also stored in this workflow run as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publishing failed or was skipped. However, the APK build and artifact upload succeeded."
            echo "Actions artifact 'app-debug-apk' remains available for download."

            echo "### ⚠️ Release Publishing Warning" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**The APK was successfully built and archived.**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Release publishing could not be completed, but your APK is safely retained in the Actions artifacts." >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Name:** \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "- Download it from the **Artifacts** section at the bottom of this Actions workflow run summary." >> $GITHUB_STEP_SUMMARY
          fi
